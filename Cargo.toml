[workspace]
resolver = "2"
members = [
    "crates/transit-network",
    "crates/transit-codec",
    "crates/transit-router",
    "crates/transit-rt",
    "crates/transit-streets",
    "crates/transit-sync",
    "crates/transit-authz",
    "crates/transit-plans",
    "crates/transit-live",
    "crates/cap-abi",
    "crates/cap-gtfs",
    "crates/cap-router",
    "crates/cap-analysis",
    "crates/cap-network",
    "crates/cap-board",
    "crates/cap-runcut",
    "crates/cap-calendar",
    "crates/cap-directory",
    "crates/cap-rt",
    "crates/cap-streets",
    "crates/cap-sync",
    "crates/cap-authz",
    "crates/cap-plans",
    "crates/cap-author",
    "crates/cap-divert",
    "crates/transit-analysis",
    "crates/transit-dispatch",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# float_roundtrip: correctly-rounded float parsing, so any f64 in a
# document survives serialize -> parse bit-exactly (the default
# parser is 1 ULP off on some values — this bit real coordinates).
# Every JSON boundary (dispatch ABI, sync documents, manifests)
# relies on it.
serde_json = { version = "1", features = ["float_roundtrip", "raw_value"] }
csv = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
thiserror = "1"
prost = "0.13"
prost-build = "0.13"
protoc-bin-vendored = "3"
# TypeScript bindings for every type that crosses the wasm boundary:
# the TS contract is generated from the Rust model (single source of
# truth — hand-written .d.ts drifts). serde-compat makes the derives
# mirror the serde attributes (tags, renames).
ts-rs = { version = "12", features = ["serde-compat"] }
# Capability modules address documents by content hash (the manifest
# format) — sha256 is the hash everywhere (Rust, JS crypto.subtle,
# Go crypto).
sha2 = "0.10"
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"

# Size the wasm artifact: without wasm-pack's wasm-opt pass, the
# release profile does the work in-repo. opt-level "s" beats 3 on wasm
# by a wide margin here; LTO + one codegen unit + abort-on-panic
# (traps are host errors, never caught) strip the rest.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
