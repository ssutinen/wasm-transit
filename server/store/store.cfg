SPECIFICATION Spec

CONSTANTS
    BlobSet = {b1, b2, b3}
    MaxCommits = 4

(* The blob hashes are symmetric — see Symmetry in store.tla. *)
SYMMETRY Symmetry

(* The MaxCommits bound can strand a state with no enabled action; that
   is the bound, not the store (the real store always accepts a commit),
   so deadlock is not checked. *)
CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    RefIntegrity
    LogChained
    PointerIsLogTail
    GCSafe
    AuthorityMonotone
    CrashSafe
